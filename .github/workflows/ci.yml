name: CivicConnect CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-check:
    name: Mobile App (React Native / Expo) Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        run: |
          cd app
          npm ci --legacy-peer-deps || npm install

      - name: Run TypeScript Check
        run: |
          cd app
          npx tsc --noEmit

  backend-check:
    name: Backend API & AI Pipeline Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff mypy

      - name: Run Ruff Linter Check
        run: |
          ruff check backend/ || true

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/ -v || true