version: '3.8'

services:
  postgres:
    image: postgis/postgis:13-3.2
    container_name: civic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: civicconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d civicconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicconnect-network

  redis:
    image: redis:7-alpine
    container_name: civic-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicconnect-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  civicconnect-network:
    driver: bridge
