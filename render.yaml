services:
  - type: web
    name: civicconnect-api
    env: python
    region: singapore
    plan: starter
    buildCommand: "./scripts/render_build.sh"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: civicconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: civicconnect-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: AI_PROVIDER
        value: nvidia_nim
      - key: NVIDIA_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: civicconnect-db
    databaseName: civicconnect
    user: civic_user
    plan: starter

kv:
  - name: civicconnect-redis
    plan: starter
